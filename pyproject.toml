[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kit-torch"
version = "0.1.0"
description = "PyTorch integration for the mlopt game — torch.export bridge, executors, model zoo, backend, calibrate/report. Split from handl-lang/graphopt packages/mlopt-torch (P3 Step D-1e)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mlopt-core",
    "mlopt-orchestrator",
    "mlopt-dtypes",
    "torch>=2.0",
    # The contraction-policy player's game maintains its pairwise
    # feature tables as NumPy arrays (and export.py's safetensors path
    # already calls ``Tensor.numpy()`` at runtime) — declare what was
    # previously only pulled in transitively by the dev environment.
    "numpy>=1.24",
]
# `kit-carriers` and `kit-cuda` are deliberate *optional* runtime
# dependencies: the torch sink builds its carrier executor table from
# the carrier lowerings (`kit_torch.adapters._executor_specs`) under a
# `try/except ModuleNotFoundError`, degrading to the trace + generic
# table without them, and `kit_torch.runners` never imports
# `CudaGraphRunner` (kit-cuda sits above this package and depends on
# it — a declared cycle is not installable).  `mlopt_native` is
# likewise lazy (`contraction_policy.py`).  None are declared here;
# the import-linter `forbidden` contract below bans every *other*
# upward edge.

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "ty==0.0.84",
    "import-linter>=2.15",
]

# The carved suite was written and measured against torch 2.14
# (graphopt's locked version): torch 2.15 removed/renamed ATen
# entries the binding tables still name (`aten.inv`, `aten.cswap`)
# and changed `torch.export` block discovery.  Constrain this repo's
# own env — consumers keep their own torch pin.
[tool.uv]
constraint-dependencies = ["torch==2.14.*"]

# Substrate pins for local dev — consumers that git-pin `kit-torch`
# resolve `mlopt-*` through their own `[tool.uv.sources]` (uv honours
# sources only at the workspace root).  kit-torch has no in-family
# deps, so this is the whole source table.
[tool.uv.sources]
mlopt-core = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-core", tag = "v0.1.14" }
mlopt-orchestrator = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-orchestrator", tag = "v0.1.14" }
mlopt-dtypes = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-dtypes", tag = "v0.1.14" }

[tool.setuptools.packages.find]
where = ["src"]

# Bundled pretrained weights — the contraction-ordering player
# (``kit_torch.contraction_policy.load_contraction_policy`` loads
# the oe-all distilled ``artifacts/contraction_policy_distilled.pt``
# lazily at call time; ``contraction_policy_curriculum.pt`` is the
# earlier RL lineage artifact, kept bundled as an alternate).
[tool.setuptools.package-data]
kit_torch = ["artifacts/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_cuda: test allocates CUDA tensors; skipped at setup when CUDA is absent or OOMs on a probe allocation",
    "slow: minutes-scale test; iterate with -m \"not slow\", run the full suite before committing",
    "e2e: crosses an external engine boundary (torch.compile/Inductor, CUDA-graph capture); module-level marker, tagged on boundary-purpose files only",
]

[tool.ruff]
target-version = "py311"
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "E501",     # line length — math/notation lines exceed 72 legitimately
    "B008",     # function-call in default arg — used for cost-fn defaults
    "SIM108",   # ternary suggestion — if/else often clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# --- typecheck (ty) -----------------------------------------------
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src"]
exclude = []

[tool.ty.terminal]
error-on-warning = false

[tool.coverage.run]
source = ["kit_torch"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
# Floor set at measurement on the carved package-bound suite (P3 Step
# D-1e) — measured 76% total on the 3,146-test suite
# (2026-11-16); the e2e/law/cross-stack tests stayed in graphopt and
# reach this package through the git dep (executors/base, runners,
# regime, region_fuse and models/hybrid sit at 0% in-repo — their
# exercise is the cross-stack side).  Tighten, never lower (ratchet
# convention, same as kit-onnx/kit-carriers/kit-cuda).
fail_under = 76
show_missing = true
exclude_also = [
    "if __name__ == ['\"]__main__['\"]:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
    "@overload",
    "return NotImplemented",
]

# import-linter: kit_torch sits in the MIDDLE of the torch stack —
# above the eqsat substrate (mlopt_core/mlopt_orchestrator/
# mlopt_dtypes) and torch/numpy, below kit_carriers/kit_cuda/
# kit_discovery and the game layer.  Its declared closure is
# stdlib + torch + numpy + the three eqsat packages; every other
# upward edge is forbidden.  kit_carriers, kit_cuda and mlopt_native
# are deliberately ABSENT from the forbidden list: the edges to them
# are real but undeclared + lazy by contract (adapters.py's carrier
# table under ModuleNotFoundError, runners.py's docstring-only
# kit_cuda mention, contraction_policy.py's guarded mlopt_native
# import) — declaring or statically banning them would either create
# an uninstallable cycle or flag the sanctioned lazy binds.
[tool.importlinter]
root_packages = ["kit_torch"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "kit_torch binds only its declared dep closure"
type = "forbidden"
source_modules = ["kit_torch"]
forbidden_modules = [
    "kit_discovery",
    "kit_onnx",
    "mlopt_host_tensor",
    "gamekit",
    "benchkit",
    "discoverykit",
    "mlopt",
]
